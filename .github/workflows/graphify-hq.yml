name: Blender-Agent Refinement Toolkit Graphify HQ
on:
  pull_request:
    branches: [graphify-hq]
    paths:
      - '.github/workflows/graphify-hq.yml'
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'
jobs:
  graphify:
    name: Exact candidate document graph and MCP read-back
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Graphify HQ generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 94be83f36d9ae056d3fd0f36a04fbad1af38bb94
          persist-credentials: false
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67a19cd11a7c793d425346e12221397d4d07aa3e
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned Graphify HQ dependencies
        run: python -m pip install --no-cache-dir --only-binary=:all: --no-deps -r tools/graphify/requirements.txt
      - name: Extract checkpoint document graph and verify MCP
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, hashlib, json, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path("tools/graphify").resolve()))
          from version_maps import make_map, verify_mcp
          source = Path("candidate-source")
          sha = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          assert sha == "67a19cd11a7c793d425346e12221397d4d07aa3e", sha
          generator = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert generator == "94be83f36d9ae056d3fd0f36a04fbad1af38bb94", generator
          paths = ["AGENTS.md", "CHANGELOG.md", "README.md", "SECURITY.md", "docs/ARCHITECTURE.md", "docs/HARNESS.md", "docs/SKILL_POLICY.md", "skills/asset-conversion/SKILL.md", "skills/mesh-repair/SKILL.md", "skills/procedural-primitives/SKILL.md"]
          docs = {p: (source / p).read_bytes().decode("utf-8") for p in paths}
          with tempfile.TemporaryDirectory() as temp:
              dest = Path(temp)
              receipt = make_map("v0.0.3.4", sha, docs, dest, candidate=True)
              assert receipt["source_commit"] == sha and receipt["release_tag"] is None
              assert receipt["graph_sha256"] == hashlib.sha256((dest / "graph.json").read_bytes()).hexdigest()
              for path, entry in receipt["documents"].items():
                  blob = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD:" + path], text=True).strip()
                  assert blob == entry["blob_sha1"], path
              asyncio.run(verify_mcp(dest / "graph.json", receipt))
              receipt["generator_commit"] = generator
              receipt["extraction_scope"] = "Markdown headings and links only; no source-code call graph"
              print("GRAPHIFY_CHECKPOINT_RECEIPT " + json.dumps(receipt, sort_keys=True))
              print("Graphify MCP read-back PASS")
          PY
