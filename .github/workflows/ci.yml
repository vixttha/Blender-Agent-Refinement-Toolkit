name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Record interpreter and platform
        run: python -c "import platform; print(platform.python_version(), platform.platform())"
      - name: Unit and negative-path tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify a real pull-request event cannot approve a release
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        env:
          RELEASE_TAG: v0.0.0
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_CI_RUN_ID: ${{ github.run_id }}
        run: |
          if rejected="$(python scripts/verify_release_approval.py 2>&1)"; then
            echo "::error::The verifier accepted a pull-request event."
            exit 1
          fi
          printf '%s\n' "$rejected"
          [[ "$rejected" == 'Release approval rejected. Release approval requires a manual workflow dispatch.' ]]
      - name: CLI version
        run: python -m blender_agent version
      - name: Verify the published README walkthrough
        if: matrix.python-version == '3.12'
        run: python tools/check_readme_walkthrough.py
      - name: Build and verify a wheel with the minimum setuptools version
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          minimum=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          build = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]
          requirement = next(item for item in build["requires"] if item.startswith("setuptools>="))
          print(requirement.removeprefix("setuptools>=").split(",")[0])
          PY
          )
          python -m venv "$RUNNER_TEMP/minimum-build"
          minimum_python="$RUNNER_TEMP/minimum-build/bin/python"
          "$minimum_python" -m pip install "setuptools==$minimum" wheel
          "$minimum_python" -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          "$minimum_python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/blender_agent-*.whl
          cd "$RUNNER_TEMP"
          "$minimum_python" - <<'PY'
          from importlib.metadata import metadata, version
          from blender_agent import __version__
          package = metadata("blender-agent")
          assert package["License-Expression"] == "MIT", package
          assert "LICENSE" in package.get_all("License-File"), package
          assert package["Version"] == __version__, package
          print(f"setuptools {version('setuptools')} wheel: SPDX MIT and installed {__version__} verified.")
          PY

  mcp-stdio:
    name: Real MCP stdio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the wheel and verify its installed MCP launcher
        run: python tests/run_mcp_wheel_smoke.py

  blender-smoke:
    name: Blender ${{ matrix.version }} real-format roundtrips
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.5.16"
            series: "4.5"
            sha256: 23432b064977908beb1ab4b7f32f024e7331105c875c187dce002aff84b10c11
            mcp-mode: minimum
          - version: "5.2.4"
            series: "5.2"
            sha256: 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
            mcp-mode: resolver
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Blender-Agent Refinement Toolkit for the CLI roundtrip
        run: python -m pip install -e .
      - name: Download and verify official Blender
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
          SIMULATE_PRIMARY_FAILURE: ${{ github.event_name == 'pull_request' && matrix.version == '5.2.4' }}
        run: |
          release="release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          download_primary() {
            if [[ "$SIMULATE_PRIMARY_FAILURE" == true ]]; then
              echo "Simulating a primary Blender download failure to test the mirror."
              return 22
            fi
            curl --fail --location --connect-timeout 10 --max-time 90 --retry 2 --retry-max-time 100 \
              --silent --show-error "https://download.blender.org/$release" -o blender.tar.xz
          }
          if ! download_primary; then
            echo "Downloading Blender $BLENDER_VERSION from the official Blender mirror service."
            if ! curl --fail --location --connect-timeout 10 --max-time 90 --retry 2 --retry-max-time 100 \
              --silent --show-error "https://mirror.blender.org/$release" -o blender.tar.xz; then
              echo "::error::Both Blender download attempts failed."
              exit 1
            fi
          fi
          printf 'Pinned Blender archive SHA-256: %s %s\n' "${release##*/}" "$BLENDER_SHA256"
          if ! printf '%s  blender.tar.xz\n' "$BLENDER_SHA256" | sha256sum --check -; then
            echo "::error::Blender archive checksum mismatch."
            exit 1
          fi
          mkdir -p blender-dist
          tar -xf blender.tar.xz -C blender-dist --strip-components=1
          ./blender-dist/blender --version | head -n 3
      - name: Exercise supported formats and validate mesh geometry
        shell: bash
        env:
          BLENDER_BIN: ./blender-dist/blender
          BART_EXPECTED_BLENDER_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p asset-sandbox/out
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" create cube out/cube.stl --size 1 | tee runtime-result.json
          python -c 'import json, os; from pathlib import Path; assert json.loads(Path("runtime-result.json").read_text())["blender_version"] == os.environ["BART_EXPECTED_BLENDER_VERSION"]'
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.glb
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.glb out/roundtrip.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.obj
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.obj out/from_obj.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.fbx
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.fbx out/from_fbx.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.blend
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.blend out/from_blend.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" repair out/cube.stl out/repaired.stl
          python - <<'PY'
          from pathlib import Path
          from blender_agent.inspect import inspect_asset
          root = Path("asset-sandbox")
          all_files = [
              "cube.stl", "cube.glb", "roundtrip.stl", "cube.obj",
              "from_obj.stl", "cube.fbx", "from_fbx.stl",
              "cube.blend", "from_blend.stl", "repaired.stl",
          ]
          for name in all_files:
              f = root / "out" / name
              assert f.is_file() and f.stat().st_size > 0, name
          for name in (
              "cube.stl", "roundtrip.stl", "from_obj.stl", "from_fbx.stl",
              "from_blend.stl", "repaired.stl",
          ):
              info = inspect_asset("out/" + name, root)
              assert info["triangles"] == 12, (name, info)
              for axis in range(3):
                  assert abs(info["bounds"]["min"][axis] + 0.5) < 0.005, (name, info)
                  assert abs(info["bounds"]["max"][axis] - 0.5) < 0.005, (name, info)
          print("Blender real-format geometry roundtrip: PASS")
          PY
      - name: Exercise the installed MCP wheel with real Blender
        env:
          BLENDER_BIN: ${{ github.workspace }}/blender-dist/blender
          MCP_MODE: ${{ matrix.mcp-mode }}
          BART_EXPECTED_BLENDER_VERSION: ${{ matrix.version }}
        run: python tests/run_mcp_wheel_smoke.py --blender "$BLENDER_BIN" --mcp-mode "$MCP_MODE"

  blender-windows:
    name: Blender 4.5.16 installed-wheel MCP / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download and verify official Blender
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $release = 'release/Blender4.5/blender-4.5.16-windows-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'blender.zip'
          curl.exe --fail --location --retry 2 --silent --show-error "https://download.blender.org/$release" -o $archive
          if ($LASTEXITCODE -ne 0) {
            curl.exe --fail --location --retry 2 --silent --show-error "https://mirror.clarkson.edu/blender/$release" -o $archive
            if ($LASTEXITCODE -ne 0) { throw 'Blender download failed' }
          }
          $expected = 'e258e90a1ebc14798ad65b3426bc5f11f5e0e013541c61cc7c3ee9bbf4ca0ce6'
          Write-Output "Pinned Blender archive SHA-256: blender-4.5.16-windows-x64.zip $expected"
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $expected) { throw 'Blender archive checksum mismatch' }
          tar.exe -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Blender extraction failed' }
          $blender = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'blender-4.5.16-windows-x64') -Filter blender.exe
          if (!$blender) { throw 'Blender executable missing after extraction' }
          & $blender.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Blender could not start' }
          "BLENDER_BIN=$($blender.FullName)" >> $env:GITHUB_ENV
      - name: Exercise the installed MCP wheel with real Blender
        shell: pwsh
        env:
          BART_EXPECTED_BLENDER_VERSION: "4.5.16"
        run: python tests/run_mcp_wheel_smoke.py --blender "$env:BLENDER_BIN"

  release-readiness:
    name: Release readiness (read-only)
    needs: [python, mcp-stdio, blender-smoke, blender-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Report the tested release candidate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          from scripts.verify_release_approval import FINAL_RELEASE_TAG, read_release_notes

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("CI checked out a different commit than the workflow event.")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = f"v{version}"
          run_id = os.environ["GITHUB_RUN_ID"]
          event = os.environ["GITHUB_EVENT_NAME"]
          lines = [
              "## Release readiness",
              "",
              "Python, MCP stdio, and real Blender jobs passed.",
              "",
              f"- Package version: `{version}`",
              f"- Tested commit: `{sha}`",
              f"- CI run: `{run_id}` (`{event}`)",
          ]
          if FINAL_RELEASE_TAG.fullmatch(tag):
              notes = read_release_notes(tag)
              notes_digest = hashlib.sha256(notes.encode("utf-8")).hexdigest()
              lines.extend([
                  f"- Release notes: `docs/releases/{tag}.md`",
                  f"- Release notes SHA-256: `{notes_digest}`",
              ])
              listing = subprocess.check_output(
                  ["git", "ls-remote", "--refs", "origin", f"refs/tags/{tag}"],
                  text=True, timeout=30,
              )
              if listing.strip():
                  lines.append(f"- Release tag: `{tag}` already exists.")
              else:
                  lines.append(f"- Release tag: `{tag}` is available.")
          else:
              lines.append("- The package version is a development checkpoint.")
          if event != "push":
              lines.append("- Publication uses the successful push run on the default branch.")
          report = "\n".join(lines) + "\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report)
              if FINAL_RELEASE_TAG.fullmatch(tag):
                  summary.write("\n### Release notes preview\n\n")
                  summary.write(notes)
          print(report, end="")
          PY
